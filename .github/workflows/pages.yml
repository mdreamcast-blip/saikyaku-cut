# main に push されたら、ブラウザ版(Android の Chrome でも動く)を GitHub Pages に公開する
name: Deploy web version to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public-web/**"
      - "assets/sfx/**"
      - "vite.pages.config.ts"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Electron / ネイティブ依存はブラウザ版に不要なのでスクリプトを走らせない
      - run: npm ci --ignore-scripts
      # 形態素解析の辞書と効果音を配信用フォルダへ
      - run: |
          mkdir -p public-web
          rm -rf public-web/dict public-web/sfx
          cp -R node_modules/kuromoji/dict public-web/dict
          cp -R assets/sfx public-web/sfx
      - run: npx vite build --config vite.pages.config.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
